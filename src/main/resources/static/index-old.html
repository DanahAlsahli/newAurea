<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurea - Smart Project Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card-hover:hover { transform: translateY(-4px); transition: all 0.3s; }
        .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <!-- Header -->
    <header class="glass shadow-lg">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-black text-purple-700">✨ Aurea</h1>
            <p class="text-gray-600 font-bold">Smart Project Assistant</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-10">
        <!-- Hero -->
        <div class="text-center text-white mb-10">
            <h2 class="text-5xl font-black mb-4">Analyze Your Project with AI</h2>
            <p class="text-xl opacity-90">Enter your project details and get a professional analysis in seconds</p>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Form Card -->
            <div class="glass rounded-3xl shadow-2xl p-8">
                <h3 class="text-2xl font-bold text-gray-800 mb-6">📝 Add New Project</h3>

                <form id="projectForm" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Project Name</label>
                        <input type="text" id="name" required
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-purple-500 outline-none"
                            placeholder="e.g., Online Abaya Store">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Description</label>
                        <textarea id="description" required rows="3"
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-purple-500 outline-none"
                            placeholder="Brief description of the project..."></textarea>
                    </div>

                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Industry</label>
                        <input type="text" id="industry" required
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-purple-500 outline-none"
                            placeholder="e.g., E-commerce">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Status</label>
                        <select id="status" required
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-purple-500 outline-none">
                            <option value="ACTIVE">Active</option>
                            <option value="PLANNING">Planning</option>
                            <option value="COMPLETED">Completed</option>
                        </select>
                    </div>

                    <button type="submit"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl transition">
                        💾 Save Project
                    </button>
                </form>
            </div>

            <!-- Results Card -->
            <div class="glass rounded-3xl shadow-2xl p-8">
                <h3 class="text-2xl font-bold text-gray-800 mb-6">📊 Projects & Analysis</h3>

                <div id="projectsList" class="space-y-4 max-h-96 overflow-y-auto">
                    <p class="text-gray-500 text-center py-10">No projects yet</p>
                </div>
            </div>
        </div>

        <!-- Analysis Modal -->
        <div id="analysisModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div class="glass rounded-3xl max-w-2xl w-full max-h-90vh overflow-y-auto p-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-3xl font-black text-purple-700">🤖 AI Analysis</h3>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
                </div>
                <div id="analysisContent"></div>
            </div>
        </div>
    </main>

    <script>
        const API = 'http://localhost:8080/api/v1';

        // Add Project
        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const project = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                industry: document.getElementById('industry').value,
                status: document.getElementById('status').value,
                userId: 1
            };

            try {
                const res = await fetch(`${API}/project/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(project)
                });

                if (res.ok) {
                    alert('✅ Project added successfully');
                    document.getElementById('projectForm').reset();
                    loadProjects();
                } else {
                    alert('❌ Failed to add project');
                }
            } catch (err) {
                alert('❌ Connection error: ' + err.message);
            }
        });

        // Load Projects
        async function loadProjects() {
            try {
                const res = await fetch(`${API}/project/get`);
                const projects = await res.json();

                const list = document.getElementById('projectsList');

                if (!projects || projects.length === 0) {
                    list.innerHTML = '<p class="text-gray-500 text-center py-10">No projects yet</p>';
                    return;
                }

                list.innerHTML = projects.map(p => `
                    <div class="card-hover bg-white rounded-2xl p-4 border-2 border-purple-100">
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold text-lg text-gray-800">${p.name}</h4>
                            <span class="text-xs bg-purple-100 text-purple-700 px-3 py-1 rounded-full">${p.status}</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-3">${p.description}</p>
                        <div class="flex gap-2">
                            <button onclick="analyzeProject(${p.id})"
                                class="flex-1 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-2 rounded-xl hover:opacity-90 transition">
                                🤖 AI Analysis
                            </button>
                            <button onclick="deleteProject(${p.id})"
                                class="bg-red-100 text-red-600 font-bold px-4 rounded-xl hover:bg-red-200 transition">
                                🗑️
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        // Analyze Project
        async function analyzeProject(id) {
            const modal = document.getElementById('analysisModal');
            const content = document.getElementById('analysisContent');

            modal.classList.remove('hidden');
            content.innerHTML = `
                <div class="text-center py-10">
                    <div class="inline-block animate-spin rounded-full h-16 w-16 border-4 border-purple-500 border-t-transparent"></div>
                    <p class="mt-4 text-gray-600 font-bold">Analyzing with AI...</p>
                </div>
            `;

            try {
                const res = await fetch(`${API}/ai-analysis/analyze/${id}`, { method: 'POST' });

                if (!res.ok) {
                    throw new Error('Analysis failed. Please check your OpenAI API key.');
                }

                const data = await res.json();

                content.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-2xl p-6 text-center">
                            <p class="text-sm opacity-90 mb-1">Overall Score</p>
                            <p class="text-6xl font-black">${data.score || '?'}<span class="text-2xl">/100</span></p>
                        </div>

                        <div class="bg-green-50 border-l-4 border-green-500 rounded-xl p-4">
                            <h4 class="font-bold text-green-700 mb-2">💪 Strengths</h4>
                            <p class="text-gray-700">${data.strengths || 'Not available'}</p>
                        </div>

                        <div class="bg-red-50 border-l-4 border-red-500 rounded-xl p-4">
                            <h4 class="font-bold text-red-700 mb-2">⚠️ Weaknesses</h4>
                            <p class="text-gray-700">${data.weaknesses || 'Not available'}</p>
                        </div>

                        <div class="bg-blue-50 border-l-4 border-blue-500 rounded-xl p-4">
                            <h4 class="font-bold text-blue-700 mb-2">💡 Recommendations</h4>
                            <p class="text-gray-700">${data.aiRecommendation || 'Not available'}</p>
                        </div>
                    </div>
                `;
            } catch (err) {
                content.innerHTML = `
                    <div class="bg-red-50 border-2 border-red-200 rounded-2xl p-6 text-center">
                        <p class="text-4xl mb-3">😔</p>
                        <p class="text-red-700 font-bold mb-2">Analysis Could Not Complete</p>
                        <p class="text-sm text-gray-600">${err.message}</p>
                        <p class="text-xs text-gray-500 mt-4">Make sure a valid OPENAI_API_KEY is set</p>
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('analysisModal').classList.add('hidden');
        }

        // Delete Project
        async function deleteProject(id) {
            if (!confirm('Are you sure you want to delete this project?')) return;
            try {
                await fetch(`${API}/project/delete/${id}`, { method: 'DELETE' });
                loadProjects();
            } catch (err) {
                alert('Failed to delete');
            }
        }

        // Initial load
        loadProjects();
    </script>
</body>
</html>
